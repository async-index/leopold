<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Museum 3D</title>
<style>
  :root { --bg: #efefee; --fg: #171717; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f7f7f6 0%, var(--bg) 70%); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hint, .caption, .arrow, .home { position: fixed; color: var(--fg); font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: -0.02em; text-transform: uppercase; }
  .home { top: 13px; left: 24px; line-height: 180%; text-decoration: none; z-index: 1; }
  .home:hover { opacity: .6; }
  .hint { left: 0; right: 0; top: 14px; text-align: center; opacity: .5; pointer-events: none; }
  .caption { left: 24px; right: 24px; bottom: 14px; display: flex; gap: 8px; justify-content: center; line-height: 180%;
    text-align: center; pointer-events: none; }
  .arrow { top: 50%; margin-top: -12px; width: 24px; height: 24px; padding: 7px; border: 0; background: none; cursor: pointer; }
  .arrow svg { display: block; width: 9px; height: 9px; }
  .arrow:hover { opacity: .6; }
  .arrow.prev { left: 16px; }
  .arrow.next { right: 16px; }
  .mode { position: fixed; top: 9px; right: 18px; padding: 5px 6px; border: 0; background: none; color: var(--fg);
    font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; text-transform: uppercase; cursor: pointer; }
  .mode:hover { opacity: .6; }
  body.grid canvas { cursor: default; }
  body.grid .hint, body.grid .arrow { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<a class="home" href="../">Leopold</a>
<div class="hint">Drag to rotate · Scroll to zoom · Right-drag to move</div>
<div class="caption"><span id="title"></span><span>·</span><span id="artist"></span><span>·</span><span id="date"></span></div>
<button class="mode" id="mode">Grid</button>
<button class="arrow prev" id="prev" aria-label="Previous image"><svg viewBox="0 0 9 9"><path d="M5 1 1.5 4.5 5 8M1.5 4.5H9" fill="none" stroke="currentColor"/></svg></button>
<button class="arrow next" id="next" aria-label="Next image"><svg viewBox="0 0 9 9"><path d="M4 1l3.5 3.5L4 8M7.5 4.5H0" fill="none" stroke="currentColor"/></svg></button>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.15;

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(-4, 3, 2);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.5);
rim.position.set(3, 1, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.25));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Facades: the model's UVs wrap the image once around the building as one band
// (seam at the back corner). Everything else — roof, stairs, terrace, balcony,
// rails — carries UV (-1, -1) and gets triplanar instead: the image cast along
// x, y and z, blended by how much the surface faces each axis, spanning the
// model's height once and mirror-repeating beyond that. Triplanar runs in the
// model's own (centred) space, so moved or turned copies keep their artwork.
function makeMaterial() {
  const u = { triMap: { value: null }, triScale: { value: 1 }, triAspect: { value: 1 },
    triNode: { value: new THREE.Matrix4() }, triOffset: { value: new THREE.Vector3() } };
  const m = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0 });
  m.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, u);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform mat4 triNode; uniform vec3 triOffset;\nvarying vec3 vTriPos;\nvarying vec3 vTriNormal;\nvarying vec2 vBandUv;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vTriPos = (triNode * vec4(transformed, 1.0)).xyz + triOffset;
        vTriNormal = normalize(mat3(triNode) * objectNormal);
        vBandUv = uv;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D triMap; uniform float triScale; uniform float triAspect;
        varying vec3 vTriPos; varying vec3 vTriNormal; varying vec2 vBandUv;
        vec4 triSample(vec2 p) { return texture2D(triMap, p * triScale * vec2(1.0 / triAspect, 1.0) + 0.5); }`)
      .replace('#include <map_fragment>', `
        vec3 tw = pow(abs(normalize(vTriNormal)), vec3(4.0));
        tw /= tw.x + tw.y + tw.z;
        vec4 triColor = triSample(vTriPos.zy) * tw.x + triSample(vTriPos.xz) * tw.y + triSample(vTriPos.xy) * tw.z;
        vec4 bandColor = texture2D(triMap, vec2(vBandUv.x, 1.0 - vBandUv.y));
        diffuseColor *= vBandUv.x < -0.5 ? triColor : bandColor;`);
  };
  return { material: m, uniforms: u };
}
const single = makeMaterial();
const tri = single.uniforms;

const works = await (await fetch('textures/works.json')).json();
const textures = new Map();
const loadTexture = src => {
  if (!textures.has(src)) textures.set(src, new THREE.TextureLoader().loadAsync(src).then(t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }));
  return textures.get(src);
};
// a works.json entry with "plain": true shows the bare model: white map, no caption
const plain = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
plain.needsUpdate = true;
const setMap = (u, t) => { u.triMap.value = t; u.triAspect.value = t.image.width / t.image.height; };
const textureFor = w => w.plain ? Promise.resolve(plain) : loadTexture(w.src);
const setCaption = w => {
  document.querySelector('.caption').style.visibility = !w || w.plain ? 'hidden' : '';
  document.getElementById('title').textContent = w?.title ?? '';
  document.getElementById('artist').textContent = w?.artist ?? '';
  document.getElementById('date').textContent = w?.date ?? '';
};
let current = 0;
async function show(i) {
  current = (i + works.length) % works.length;
  const w = works[current];
  const t = w.plain ? plain : await loadTexture(w.src);
  if (works[current] !== w) return; // a later click won
  setMap(tri, t);
  setCaption(w);
  const next = works[(current + 1) % works.length];
  if (!next.plain) loadTexture(next.src);
}
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
addEventListener('keydown', e => {
  if (gridMode) return;
  if (e.key === 'ArrowLeft') show(current - 1);
  else if (e.key === 'ArrowRight') show(current + 1);
});
await show(0);

let model, size, centre, singleView;
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('museum.glb', gltf => {
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.material = single.material; o.castShadow = o.receiveShadow = true; if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); } });
  const box = new THREE.Box3().setFromObject(model);
  size = box.getSize(new THREE.Vector3()); centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  scene.add(model);
  model.updateMatrixWorld();
  const mesh = model.getObjectByProperty('isMesh', true);
  tri.triScale.value = 1 / size.y;
  tri.triNode.value.copy(mesh.matrix);        // mesh node transform (gltfpack's dequantisation)
  tri.triOffset.value.copy(centre).negate();  // centred, as in the single view
  fitShadow(size.length() / 2);
  key.shadow.bias = -0.0002; key.shadow.normalBias = size.length() / 2 * 0.002;
  // frame like the source image (building ~85% of the view width, ~60% of its height), then pulled back a bit
  const r = size.length() / 2;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const dist = 1.05 * (Math.max(size.y / 2 / 0.6, size.x / 2 / 0.85 / camera.aspect) / Math.tan(halfFov) + size.z / 2);
  // start at the source image's three-quarter view
  const az = THREE.MathUtils.degToRad(-38), el = THREE.MathUtils.degToRad(4);
  camera.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist);
  camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
  controls.minDistance = r * 0.6; controls.maxDistance = dist * 3;
  controls.update();
  singleView = { position: camera.position.clone(), target: controls.target.clone() };
  window.READY = true;
});

// shadow frustum fitted to a radius around the origin (keeps the light's direction)
function fitShadow(r) {
  key.position.normalize().multiplyScalar(r * 2);
  Object.assign(key.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: r * 0.5, far: r * 3.5 });
  key.shadow.camera.updateProjectionMatrix();
}

// ---- grid: 3 x 3 museums facing the camera like the single view, artworks in list order ----
const COLS = 3, ROWS = 3, TURN = THREE.MathUtils.degToRad(15), TILT = THREE.MathUtils.degToRad(5);
let gridMode = false, grid = null, hovered = null;
const pointer = new THREE.Vector2(), raycaster = new THREE.Raycaster();
function buildGrid() {
  const group = new THREE.Group(), cells = [];
  const mesh = model.getObjectByProperty('isMesh', true);
  for (let i = 0; i < COLS * ROWS; i++) {
    const w = works[i % works.length], mat = makeMaterial();
    Object.assign(mat.uniforms.triScale, { value: tri.triScale.value });
    mat.uniforms.triNode.value.copy(tri.triNode.value); mat.uniforms.triOffset.value.copy(tri.triOffset.value);
    textureFor(w).then(t => setMap(mat.uniforms, t));
    const copy = model.clone();
    copy.position.copy(centre).negate();            // pivot sits at the model's centre
    copy.traverse(o => { if (o.isMesh) o.material = mat.material; });
    const pivot = new THREE.Group(); pivot.add(copy);
    pivot.userData = { work: w, target: new THREE.Euler() };
    group.add(pivot); cells.push(pivot);
  }
  return { group, cells };
}
function layoutGrid() {
  // lay the cells out in the plane facing the single-view camera
  const dir = singleView.position.clone().sub(singleView.target).normalize();
  const right = new THREE.Vector3(0, 1, 0).cross(dir).normalize(), up = dir.clone().cross(right);
  const sx = Math.hypot(size.x, size.z) * 1.08, sy = size.y * 1.9;
  grid.cells.forEach((p, i) => {
    const c = i % COLS - (COLS - 1) / 2, r = Math.floor(i / COLS) - (ROWS - 1) / 2;
    p.position.copy(right).multiplyScalar(c * sx).addScaledVector(up, -r * sy);
  });
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const w = COLS * sx, h = ROWS * sy;
  const dist = 1.08 * Math.max(h / 2 / Math.tan(halfFov), w / 2 / Math.tan(halfFov) / camera.aspect);
  camera.position.copy(dir).multiplyScalar(dist);
  camera.lookAt(0, 0, 0);
  camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
  fitShadow(Math.hypot(w, h) / 2 + size.length() / 2);
}
function setGrid(on) {
  gridMode = on;
  document.body.classList.toggle('grid', on);
  document.getElementById('mode').textContent = on ? 'Single' : 'Grid';
  if (on) {
    grid ??= buildGrid();
    scene.remove(model); scene.add(grid.group);
    controls.enabled = false;
    layoutGrid();
    hovered = null; setCaption(null);
  } else {
    scene.remove(grid.group); scene.add(model);
    grid.cells.forEach(p => { p.rotation.set(0, 0, 0); p.userData.target.set(0, 0, 0); });
    camera.position.copy(singleView.position); controls.target.copy(singleView.target);
    controls.enabled = true; controls.update();
    fitShadow(size.length() / 2);
    show(current);
  }
}
document.getElementById('mode').onclick = () => { if (window.READY) setGrid(!gridMode); };
renderer.domElement.addEventListener('pointermove', e => {
  if (!gridMode) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(grid.cells, true)[0];
  let cell = hit?.object; while (cell && !grid.cells.includes(cell)) cell = cell.parent;
  if (cell !== hovered) {
    if (hovered) hovered.userData.target.set(0, 0, 0);
    hovered = cell ?? null;
    setCaption(hovered?.userData.work);
  }
  if (hovered) {
    // turn toward the cursor: offset from the museum's on-screen centre, in cell widths
    const c = hovered.getWorldPosition(new THREE.Vector3()).project(camera);
    const dx = THREE.MathUtils.clamp((pointer.x - c.x) * COLS / 2, -1, 1);
    const dy = THREE.MathUtils.clamp((pointer.y - c.y) * ROWS / 2, -1, 1);
    hovered.userData.target.set(-dy * TILT, dx * TURN, 0);
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  if (hovered) hovered.userData.target.set(0, 0, 0);
  hovered = null; if (gridMode) setCaption(null);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (gridMode) layoutGrid();
});
renderer.setAnimationLoop(() => {
  if (gridMode) grid.cells.forEach(p => {       // ease each museum toward its target turn
    const t = p.userData.target;
    p.rotation.x += (t.x - p.rotation.x) * 0.08;
    p.rotation.y += (t.y - p.rotation.y) * 0.08;
  });
  else controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
