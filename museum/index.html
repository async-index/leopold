<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum 3D</title>
<style>
  :root { --bg: #efefee; --fg: #171717; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f7f7f6 0%, var(--bg) 70%); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hint { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: var(--fg); opacity: .5; pointer-events: none;
    font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="hint">Drag to rotate · Scroll to zoom · Right-drag to move</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.25;

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(-4, 3, 2);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.5);
rim.position.set(3, 1, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.5));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const material = new THREE.MeshStandardMaterial({ color: 0xf0f0ee, roughness: 0.9, metalness: 0 });

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('museum.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.material = material; o.geometry.computeVertexNormals(); } });
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  scene.add(model);
  // frame like the source image: building ~85% of the view width, ~60% of its height
  const r = size.length() / 2;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const dist = 0.9 * (Math.max(size.y / 2 / 0.6, size.x / 2 / 0.85 / camera.aspect) / Math.tan(halfFov) + size.z / 2);
  // start at the source image's three-quarter view
  const az = THREE.MathUtils.degToRad(-38), el = THREE.MathUtils.degToRad(4);
  camera.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist);
  camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
  controls.minDistance = r * 0.6; controls.maxDistance = dist * 3;
  controls.update();
  window.READY = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
