<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Figure 3D</title>
<style>
  :root { --bg: #efefee; --fg: #171717; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #f7f7f6 0%, var(--bg) 70%); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hint, .caption, .arrow, .home { position: fixed; color: var(--fg); font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: -0.02em; text-transform: uppercase; }
  .home { top: 13px; left: 24px; line-height: 180%; text-decoration: none; z-index: 1; }
  .home:hover { opacity: .6; }
  .hint { left: 0; right: 0; top: 14px; text-align: center; opacity: .5; pointer-events: none; }
  .caption { left: 24px; right: 24px; bottom: 14px; display: flex; gap: 8px; justify-content: center; line-height: 180%;
    text-align: center; pointer-events: none; }
  .arrow { top: 50%; margin-top: -12px; width: 24px; height: 24px; padding: 7px; border: 0; background: none; cursor: pointer; }
  .arrow svg { display: block; width: 9px; height: 9px; }
  .arrow:hover { opacity: .6; }
  .arrow.prev { left: 16px; }
  .arrow.next { right: 16px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<a class="home" href="../">Leopold</a>
<div class="hint">Drag to rotate · Scroll to zoom · Right-drag to move</div>
<div class="caption"><span id="title"></span><span>·</span><span id="artist"></span><span>·</span><span id="date"></span></div>
<button class="arrow prev" id="prev" aria-label="Previous image"><svg viewBox="0 0 9 9"><path d="M5 1 1.5 4.5 5 8M1.5 4.5H9" fill="none" stroke="currentColor"/></svg></button>
<button class="arrow next" id="next" aria-label="Next image"><svg viewBox="0 0 9 9"><path d="M4 1l3.5 3.5L4 8M7.5 4.5H0" fill="none" stroke="currentColor"/></svg></button>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-2, 3, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
rim.position.set(3, 1, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.6));

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Triplanar: the image is cast along x, y and z in world space and blended by
// how much the surface faces each axis — no UVs needed. It spans the figure's
// height once and mirror-repeats beyond that.
const tri = { triMap: { value: null }, triScale: { value: 1 }, triAspect: { value: 1 } };
const material = new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0 });
material.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, tri);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNormal;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vTriPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vTriNormal = normalize(mat3(modelMatrix) * objectNormal);`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D triMap; uniform float triScale; uniform float triAspect;
      varying vec3 vTriPos; varying vec3 vTriNormal;
      vec4 triSample(vec2 p) { return texture2D(triMap, p * triScale * vec2(1.0 / triAspect, 1.0) + 0.5); }`)
    .replace('#include <map_fragment>', `
      vec3 tw = pow(abs(normalize(vTriNormal)), vec3(4.0));
      tw /= tw.x + tw.y + tw.z;
      diffuseColor *= triSample(vTriPos.zy) * tw.x + triSample(vTriPos.xz) * tw.y + triSample(vTriPos.xy) * tw.z;`);
};

const works = await (await fetch('textures/works.json')).json();
const textures = new Map();
const loadTexture = src => {
  if (!textures.has(src)) textures.set(src, new THREE.TextureLoader().loadAsync(src).then(t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }));
  return textures.get(src);
};
let current = 0;
async function show(i) {
  current = (i + works.length) % works.length;
  const w = works[current];
  const t = await loadTexture(w.src);
  if (works[current] !== w) return; // a later click won
  tri.triMap.value = t;
  tri.triAspect.value = t.image.width / t.image.height;
  document.getElementById('title').textContent = w.title;
  document.getElementById('artist').textContent = w.artist;
  document.getElementById('date').textContent = w.date;
  loadTexture(works[(current + 1) % works.length].src);
}
document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(current - 1);
  else if (e.key === 'ArrowRight') show(current + 1);
});
await show(0);

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('figure.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.material = material; o.geometry.computeVertexNormals(); } });
  // centre and fit
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  scene.add(model);
  tri.triScale.value = 1 / size.y;
  // frame like the source image: figure ~75% of the view height
  const r = size.length() / 2;
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const dist = Math.max(size.y / 2 / 0.75, size.x / 2 / 0.75 / camera.aspect) / Math.tan(halfFov) + size.z / 2;
  camera.position.set(0, 0, dist);
  camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
  controls.minDistance = r * 0.6; controls.maxDistance = dist * 3;
  controls.update();
  window.READY = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
