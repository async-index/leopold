<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Hoffmann</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  .cell { position: fixed; left: 0; top: 0; background: #ddd 50% 15% / cover no-repeat; /* crop high: heads sit near the top */ will-change: transform, width, height; }
  body.over { cursor: pointer; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; }
  body:not(.over) .caption { visibility: hidden; }
</style>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script>
const GUTTER = 7, SIDE = 24, TOP = 40, BOTTOM = 40, DUR = 1000, MINF = 0.12;

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
let W, H, min, max, minSide, works = [], root, over = null, mx = -1e4, my = -1e4;

// Tree: leaf {work, el} or split {dir: 'v' (side by side) | 'h' (stacked), a, b, r (a's share), anim}.
const isLeaf = n => !n.a;
const ratio = (n, now) => {
  if (!n.anim) return n.r;
  const k = Math.min(1, (now - n.anim.t0) / n.anim.dur);
  n.r = n.anim.from + (n.anim.to - n.anim.from) * ease(k);
  if (k >= 1) { const f = n.anim.done; n.anim = null; f && f(); }
  return n.r;
};
const used = () => new Set(root ? leaves(root).map(l => l.work) : []);
function leaves(n, out = []) { isLeaf(n) ? out.push(n) : (leaves(n.a, out), leaves(n.b, out)); return out; }
function nodes(n, out = []) { if (!isLeaf(n)) { out.push(n); nodes(n.a, out); nodes(n.b, out); } return out; }

function newLeaf() {
  const free = works.filter(w => !used().has(w));
  const work = free[Math.floor(Math.random() * free.length)];
  const el = document.createElement('div');
  el.className = 'cell'; el.style.backgroundImage = `url(${work.src})`;
  document.body.appendChild(el);
  return { work, el };
}

// Lay out into rects; leaf boxes are stored on the leaf.
function place(n, x, y, w, h, now) {
  if (isLeaf(n)) { n.x = x; n.y = y; n.w = w; n.h = h; return; }
  const r = ratio(n, now);
  if (isLeaf(n)) return place(n, x, y, w, h, now);
  if (n.dir === 'v') { place(n.a, x, y, w * r, h, now); place(n.b, x + w * r, y, w * (1 - r), h, now); }
  else { place(n.a, x, y, w, h * r, now); place(n.b, x, y + h * r, w, h * (1 - r), now); }
}

// Cells with room for a split, as [leaf, dir, ratio].
function splitOptions() {
  const out = [];
  for (const l of leaves(root)) {
    for (const dir of ['v', 'h']) {
      const len = dir === 'v' ? l.w : l.h, r = rnd(.4, .6);
      if (len * Math.min(r, 1 - r) - GUTTER >= minSide) out.push([l, dir, r, l.w * l.h * (len > (dir === 'v' ? l.h : l.w) ? 1.5 : 1)]);
    }
  }
  return out;
}
function split(instant) {
  const opts = splitOptions(); if (!opts.length) return false;
  let t = Math.random() * opts.reduce((s, o) => s + o[3], 0), o = opts[0];
  for (const c of opts) if ((t -= c[3]) <= 0) { o = c; break; }
  const [l, dir, r] = o, old = { work: l.work, el: l.el }, nw = newLeaf(), newFirst = Math.random() < .5;
  delete l.work; delete l.el;
  Object.assign(l, { dir, a: newFirst ? nw : old, b: newFirst ? old : nw });
  const to = newFirst ? r : 1 - r, from = newFirst ? 0 : 1;
  l.r = instant ? to : from;
  if (!instant) l.anim = { from, to, t0: performance.now(), dur: DUR };
  return true;
}
function merge() {
  const opts = nodes(root).filter(n => !n.anim && isLeaf(n.a) && isLeaf(n.b));
  if (!opts.length) return false;
  const n = opts[Math.floor(Math.random() * opts.length)], keepA = Math.random() < .5;
  n.anim = { from: n.r, to: keepA ? 1 : 0, t0: performance.now(), dur: DUR, done() {
    const keep = keepA ? n.a : n.b, gone = keepA ? n.b : n.a;
    gone.el.remove();
    delete n.a; delete n.b; delete n.dir; delete n.r;
    n.work = keep.work; n.el = keep.el;
  } };
  return true;
}
function step(instant) {
  const c = leaves(root).length, busy = nodes(root).some(n => n.anim);
  if (busy && !instant) return;
  const wantSplit = c < min || (c < max && Math.random() < .5);
  if (c >= max || !wantSplit) { if (c > min && merge()) return; }
  split(instant);
}

function layout() {
  W = innerWidth; H = innerHeight;
  max = Math.max(4, Math.min(9, Math.round(W * H / 150000))); min = Math.max(3, max - 4);
  minSide = Math.min(W, H) * MINF;
}
function frame(now) {
  place(root, SIDE - GUTTER / 2, TOP - GUTTER / 2, W - 2 * SIDE + GUTTER, H - TOP - BOTTOM + GUTTER, now);
  let hit = null;
  for (const l of leaves(root)) {
    const x = l.x + GUTTER / 2, y = l.y + GUTTER / 2, w = Math.max(0, l.w - GUTTER), h = Math.max(0, l.h - GUTTER);
    l.el.style.transform = `translate(${x}px,${y}px)`; l.el.style.width = w + 'px'; l.el.style.height = h + 'px';
    if (mx >= x && mx < x + w && my >= y && my < y + h) hit = l;
  }
  if (hit?.work !== over?.work) {
    over = hit; document.body.classList.toggle('over', !!hit);
    if (hit) for (const k of ['t', 'a', 'd']) document.querySelector('.caption .' + k).textContent =
      hit.work[{ t: 'title', a: 'artist', d: 'date' }[k]];
  }
  requestAnimationFrame(frame);
}

addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
document.addEventListener('pointerleave', () => { mx = my = -1e4; });
document.addEventListener('click', e => { mx = e.clientX; my = e.clientY; over && open(over.work.url, '_blank'); });
addEventListener('resize', layout);

fetch('../islands/works.json').then(r => r.json()).then(async list => {
  works = list.map(w => ({ ...w, src: '../islands/' + w.src }));
  await Promise.all(works.map(w => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = w.src; })));
  layout();
  root = newLeaf(); root.w = W; root.h = H;
  for (let i = 0; i < 40 && leaves(root).length < Math.round((min + max) / 2); i++) { place(root, 0, 0, W, H, 0); split(true); }
  requestAnimationFrame(frame);
  if (!still) (function tick() { step(); setTimeout(tick, rnd(2500, 3500)); })();
});
</script>
</body>
</html>
