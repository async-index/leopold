<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Coral</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; transition: opacity .5s; }
  .caption.out { opacity: 0; }
</style>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<canvas></canvas>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script>
const G = 384, FILL = 0.8; // G: sim cells per side, FILL: painting height / short side
const F = 0.0545, K = 0.062, TH = 0.12, SPS = 1600; // feed, kill, mask threshold, sim steps per second
const GROW = 9200, RES = 2400; // ms: growth, resolve

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: false });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
gl.getExtension('EXT_color_buffer_float');

const tri = `#version 300 es
void main() { gl_Position = vec4(float(gl_VertexID & 1) * 4.0 - 1.0, float(gl_VertexID >> 1) * 4.0 - 1.0, 0.0, 1.0); }`;

const simFrag = `#version 300 es
precision highp float;
uniform sampler2D uS; uniform float uDt, uF, uK; uniform vec4 uP; // uP: stamp x, y (0..1), radius in cells, on
out vec4 o;
const int N = ${G};
vec4 at(ivec2 c) { return texelFetch(uS, clamp(c, ivec2(0), ivec2(N - 1)), 0); }
void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s = at(c), a = at(c + ivec2(1, 0)), b = at(c - ivec2(1, 0)), d = at(c + ivec2(0, 1)), e = at(c - ivec2(0, 1));
  vec4 f = at(c + ivec2(1, 1)), g = at(c + ivec2(1, -1)), h = at(c + ivec2(-1, 1)), i = at(c - ivec2(1, 1));
  vec2 l = 0.2 * (a.rg + b.rg + d.rg + e.rg) + 0.05 * (f.rg + g.rg + h.rg + i.rg) - s.rg;
  float r = s.r * s.g * s.g, u = s.r, v = s.g;
  u += uDt * (l.x - r + uF * (1.0 - u));
  v += uDt * (0.5 * l.y + r - (uF + uK) * v);
  if (uP.w > 0.0) {
    vec2 q = (gl_FragCoord.xy / float(N) - uP.xy) * float(N);
    float ph = dot(uP.xy, vec2(37.0, 17.0)), an = atan(q.y, q.x), r = uP.z * (1.0 + 0.3 * sin(3.0 * an + ph) + 0.2 * sin(5.0 * an + 2.0 * ph));
    float k = 1.0 - smoothstep(r - 1.0, r + 1.0, length(q));
    v = max(v, 0.25 * k); u = min(u, 1.0 - 0.5 * k);
  }
  float dist = max(max(max(a.b, b.b), max(d.b, e.b)) - 1.0 / 64.0, max(max(f.b, g.b), max(h.b, i.b)) - 1.41 / 64.0);
  o = vec4(u, v, max(max(s.b, dist), smoothstep(${TH}, ${TH + 0.04}, v)), 1.0);
}`;

const drawFrag = `#version 300 es
precision highp float;
uniform sampler2D uS, uA, uB; uniform vec2 uRes, uOrg; uniform float uSize, uR, uFin, uMix, uStill;
out vec4 o;
void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y), q = p - uOrg;
  vec2 e = min(q, uSize - q);
  float cov = clamp(min(e.x, e.y) + 0.5, 0.0, 1.0);
  vec3 paper = vec3(0.976);
  if (cov <= 0.0) { o = vec4(paper, 1.0); return; }
  vec2 uv = q / uSize;
  vec3 A = texture(uA, uv).rgb, B = texture(uB, uv).rgb;
  vec3 c;
  if (uStill > 0.5) c = mix(A, B, uMix);
  else {
    vec4 s = texture(uS, uv);
    float cell = uSize / ${G}.0;
    float sd = (s.g - ${TH}) / max(length(vec2(dFdx(s.g), dFdy(s.g))), 1e-4);
    sd = clamp(sd, -64.0, 64.0);
    float sdD = (uR - (1.0 - s.b) * 64.0) * cell;
    float d = max(sd, sdD);
    float m = clamp(d + 0.5, 0.0, 1.0);
    m = max(m, uFin);
    float edge = 1.0 - smoothstep(0.0, 1.3, abs(d)), fade = 1.0 - smoothstep(0.0, 4.0, uR);
    vec3 a = A;
    a *= 1.0 - 0.25 * exp(min(d, 0.0) / 9.0) * (1.0 - step(0.0, d)) * fade;
    c = mix(a, B, m);
    c = mix(c, paper, edge * 0.9 * fade);
  }
  o = vec4(mix(paper, c, cov), 1.0);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
function program(frag) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, tri)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(p);
  const u = {}; for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
const sim = program(simFrag), draw = program(drawFrag);

const simTex = [0, 1].map(() => {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, G, G);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  return t;
});
const fbo = simTex.map(t => {
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f;
});
let cur_ = 0; // index of the sim texture holding the latest state

function step(dt, stamp) {
  gl.useProgram(sim.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1 - cur_]); gl.viewport(0, 0, G, G);
  gl.bindTexture(gl.TEXTURE_2D, simTex[cur_]);
  gl.uniform1f(sim.u.uDt, dt); gl.uniform1f(sim.u.uF, F); gl.uniform1f(sim.u.uK, K);
  gl.uniform4f(sim.u.uP, ...(stamp || [0, 0, 0, 0]));
  gl.drawArrays(gl.TRIANGLES, 0, 3); cur_ = 1 - cur_;
}
function reset() {
  for (const f of fbo) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clearBufferfv(gl.COLOR, 0, [1, 0, 0, 0]); }
}

function texture(img) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

let works = [], cur = 0, nxt = 0, clock = 0, seeds = [], captioned = false;
let W, H, dpr, org, size, acc = 0, last = 0;

function resize() {
  dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  size = Math.round(FILL * Math.min(canvas.width, canvas.height));
  org = [Math.round((canvas.width - size) / 2), Math.round((canvas.height - size) / 2)];
}

function show(i) {
  const w = works[i], c = document.querySelector('.caption');
  c.classList.add('out');
  setTimeout(() => {
    for (const k of ['title', 'artist', 'date']) c.querySelector('.' + k[0]).textContent = w[k];
    c.classList.remove('out');
  }, 500);
}

function cycle(first) { // current work becomes A, pick B, reseed
  if (!first) cur = nxt;
  nxt = (cur + 1 + Math.floor(Math.random() * (works.length - 1))) % works.length;
  clock = 0; captioned = false;
  if (still) return;
  reset();
  const cells = [...Array(9).keys()].sort(() => Math.random() - 0.5).slice(0, 7); // jittered 3x3 grid, 7 cells
  seeds = cells.map((c, i) => [i < 3 ? 0 : 200 + Math.random() * 1600,
    ((c % 3) + 0.2 + Math.random() * 0.6) / 3, (Math.floor(c / 3) + 0.2 + Math.random() * 0.6) / 3]).sort((a, b) => a[0] - b[0]);
}

const ease = x => x * x * (3 - 2 * x);
function frame(ms) {
  const dt = Math.min(ms - last, 50); last = ms;
  const period = still ? 6000 : GROW + RES, resolveT = still ? 0 : Math.max(0, (clock - GROW) / RES);
  clock += dt;
  if (!still) {
    while (seeds.length && seeds[0][0] <= clock) { const s = seeds.shift(); step(0, [s[1], s[2], 6, 1]); }
    acc += dt * SPS / 1000;
    for (; acc >= 1; acc--) step(1);
    if (!captioned && clock > GROW + RES * 0.35) { captioned = true; show(nxt); }
  } else if (!captioned && clock > period * 0.5) { captioned = true; show(nxt); }
  if (clock >= period) cycle(false);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(draw.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, simTex[cur_]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, works[cur].tex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, works[nxt].tex);
  gl.activeTexture(gl.TEXTURE0);
  const u = draw.u, rp = still ? 0 : Math.max(0, (clock - GROW) / RES);
  gl.uniform1i(u.uS, 0); gl.uniform1i(u.uA, 1); gl.uniform1i(u.uB, 2);
  gl.uniform2f(u.uRes, canvas.width, canvas.height); gl.uniform2f(u.uOrg, ...org); gl.uniform1f(u.uSize, size);
  gl.uniform1f(u.uR, still || clock < GROW ? -1000 : -1 + 6 * Math.pow(rp, 1.3));
  gl.uniform1f(u.uFin, ease(Math.min(Math.max((rp - 0.75) / 0.25, 0), 1)));
  gl.uniform1f(u.uMix, still ? ease(Math.min(Math.max((clock - period * 0.5) / 1200, 0), 1)) : 0);
  gl.uniform1f(u.uStill, still ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}

let prev = null;
function paint(e) {
  const r = canvas.getBoundingClientRect(), x = ((e.clientX - r.left) * dpr - org[0]) / size, y = ((e.clientY - r.top) * dpr - org[1]) / size;
  if (still) return;
  const from = prev || [x, y], n = Math.max(1, Math.ceil(Math.hypot(x - from[0], y - from[1]) * G / 3));
  for (let i = 1; i <= n; i++) {
    const px = from[0] + (x - from[0]) * i / n, py = from[1] + (y - from[1]) * i / n;
    if (px > 0 && px < 1 && py > 0 && py < 1) step(0, [px, py, 6, 1]);
  }
  prev = [x, y];
}
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); prev = null; paint(e); });
canvas.addEventListener('pointermove', e => { if (e.buttons) paint(e); });
canvas.addEventListener('pointerup', () => { prev = null; });
addEventListener('resize', resize);

(async () => {
  works = await (await fetch('../islands/works.json')).json();
  await Promise.all(works.map(w => new Promise(res => {
    w.img = new Image(); w.img.onload = res; w.img.src = '../islands/' + w.src;
  })));
  for (const w of works) w.tex = texture(w.img);
  cur = Math.floor(Math.random() * works.length);
  resize(); cycle(true); show(cur);
  last = performance.now(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
