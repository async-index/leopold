<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Ring</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  body.over canvas { cursor: pointer; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script type="module">
import * as THREE from 'three';

const H = 1, GAP = 0.22, SPIN = 0.06, SKEW = 0.18; // card height, gap between cards, idle spin in radians per second, max hover tilt in radians
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf9f9f9);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf9f9f9, 3, 9); // far side of the ring fades into the page
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);

const works = await (await fetch('works.json')).json();
const loader = new THREE.TextureLoader();
const widths = works.map(w => H * w.w / w.h);
const R = (widths.reduce((a, b) => a + b, 0) + GAP * works.length) / (2 * Math.PI);

// Ring tilted slightly, like a wheel seen a little from above and rolled.
const tilt = new THREE.Group(); tilt.rotation.set(0.12, 0, -0.08); scene.add(tilt);
const ring = new THREE.Group(); tilt.add(ring);
const cards = [], groups = [];
let a = 0;
works.forEach((w, i) => {
  const tex = loader.load(w.src); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshBasicMaterial({ map: tex });
  const ghost = new THREE.Object3D(); // the card's slot in the ring, for flying back
  const geo = new THREE.PlaneGeometry(widths[i], H);
  const mid = a + (widths[i] / 2) / R; a += (widths[i] + GAP) / R;
  // One group per card (tilted on hover) holding two single-sided planes,
  // so the work reads unmirrored from both sides of the ring.
  const card = new THREE.Group();
  card.position.set(Math.sin(mid) * R, 0, Math.cos(mid) * R);
  card.rotation.order = 'YXZ'; card.rotation.y = mid;
  card.userData = { tx: 0, ty: 0, mat, ghost };
  ghost.position.copy(card.position); ghost.rotation.copy(card.rotation);
  ring.add(card, ghost); groups.push(card);
  for (const back of [0, 1]) {
    const m = new THREE.Mesh(geo, mat);
    m.rotation.y = back * Math.PI;
    m.userData = { i, mid, back };
    card.add(m); cards.push(m);
  }
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  // Front card ~70% of the height; pull back a little on narrow screens so neighbours show.
  const d = H / 0.7 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * Math.sqrt(Math.max(1, 0.9 / camera.aspect));
  // Aim at the ring's front as the tilt places it, so the band sits centred.
  const front = new THREE.Vector3(0, 0, R).applyEuler(tilt.rotation);
  camera.position.set(front.x, front.y + 0.08, front.z + d); camera.lookAt(front.x * 0.5, front.y * 0.6, front.z * 0.3);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Spin: idle drift plus wheel/drag impulses with inertia.
let rot = 0, vel = 0, drag = null, moved = 0;
addEventListener('wheel', e => { vel -= e.deltaY * 0.00012; }, { passive: true });
renderer.domElement.addEventListener('pointerdown', e => { drag = e.clientX; moved = 0; renderer.domElement.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => { drag = null; });
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(-9, -9);
let over = null;
addEventListener('pointermove', e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  if (drag !== null) { const dx = e.clientX - drag; drag = e.clientX; moved += Math.abs(dx); vel = dx * 0.0009; }
});
// Click a card: it flies out of the ring to the centre, the ring stops and fades;
// Escape (or another click) flies it back into its slot.
let opened = -1, p = 0, goal = 0;
const from = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() }, to = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };
function show(i) {
  opened = i; goal = 1; vel = 0; shown = -1;
  const g = groups[i];
  g.updateWorldMatrix(true, false); g.getWorldPosition(from.pos); g.getWorldQuaternion(from.quat);
  scene.attach(g);
  // Drawn on top and unfogged while out of the ring.
  g.userData.mat.depthTest = false; g.userData.mat.fog = false; g.userData.mat.needsUpdate = true;
  g.children.forEach(m => m.renderOrder = 1);
  cap('t').textContent = works[i].title; cap('a').textContent = works[i].artist; cap('d').textContent = works[i].date;
}
function hide() { if (opened >= 0) goal = 0; }
function land() {
  const g = groups[opened], { ghost, mat } = g.userData;
  ring.add(g); g.position.copy(ghost.position); g.rotation.copy(ghost.rotation); g.userData.tx = g.userData.ty = 0;
  mat.depthTest = true; mat.fog = true; mat.needsUpdate = true;
  g.children.forEach(m => m.renderOrder = 0);
  opened = -1; shown = -1; vel = 0;
}
renderer.domElement.addEventListener('click', () => {
  if (moved >= 5) return;
  if (opened >= 0) hide(); else if (over) show(over.userData.i);
});
addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const cap = k => document.querySelector('.caption .' + k);
let shown = -1;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (drag === null) vel *= Math.pow(0.04, dt);
  if (opened >= 0) {
    p = goal ? Math.min(1, p + dt / 0.9) : Math.max(0, p - dt / 0.9);
    const e = ease(still ? goal : p), g = groups[opened];
    // Centre pose: facing the camera, ~72% of the height (or 86% of the width, whichever is tighter).
    const t2 = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const D = Math.max(H / (0.72 * t2), widths[opened] / (0.86 * t2 * camera.aspect));
    to.pos.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), D); to.quat.copy(camera.quaternion);
    if (!goal) { g.userData.ghost.getWorldPosition(from.pos); g.userData.ghost.getWorldQuaternion(from.quat); }
    g.position.lerpVectors(from.pos, to.pos, e); g.quaternion.slerpQuaternions(from.quat, to.quat, e);
    scene.fog.near = 3 - 3 * e; scene.fog.far = 9 - 5.8 * e;
    document.body.classList.toggle('over', goal === 1);
    if (!goal && p === 0) land();
    renderer.render(scene, camera); return;
  }
  rot += (still ? 0 : SPIN * dt) + vel;
  ring.rotation.y = -rot;

  // Caption: the card currently facing the camera.
  const front = works.map((_, i) => i).reduce((b, i) => {
    const d = x => Math.abs(Math.atan2(Math.sin(x), Math.cos(x)));
    return d(cards[i * 2].userData.mid - rot) < d(cards[b * 2].userData.mid - rot) ? i : b;
  }, 0);
  if (front !== shown) {
    shown = front; cap('t').textContent = works[front].title; cap('a').textContent = works[front].artist; cap('d').textContent = works[front].date;
  }

  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(cards)[0];
  over = hit?.object ?? null;
  // Hover: the card tips under the cursor in 3D; the others ease back flat.
  groups.forEach((g, i) => {
    const on = hit && drag === null && over.userData.i === i;
    const ux = on ? (over.userData.back ? 1 - hit.uv.x : hit.uv.x) - 0.5 : 0, uy = on ? hit.uv.y - 0.5 : 0;
    g.userData.tx += (-uy * 2 * SKEW - g.userData.tx) * 0.1; g.userData.ty += (ux * 2 * SKEW - g.userData.ty) * 0.1;
    g.rotation.x = g.userData.tx; g.rotation.y = cards[i * 2].userData.mid + g.userData.ty;
  });
  document.body.classList.toggle('over', !!over && drag === null);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
