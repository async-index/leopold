<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Louvres</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; transition: opacity .5s; }
  .caption.out { opacity: 0; }
</style>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<canvas></canvas>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script>
const N = 18, FOV = 30 * Math.PI / 180, FILL = 0.8; // N: slats, FILL: painting height / short side
const TURN = 2600, HOLD = 5000, STAGGER = 0.16, THICK = 0.012, TILT = 5 * Math.PI / 180; // ms, ms, share of TURN, slat thickness in picture widths, max cursor tilt

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: true });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const vert = `#version 300 es
uniform float uP, uH, uAx, uD; uniform int uN;
uniform mat3 uR; uniform vec2 uF;
out vec2 vA; out float vK, vS;
const int TRI[6] = int[6](0, 1, 2, 2, 1, 3);
void main() {
  int face = gl_VertexID / 6, k = TRI[gl_VertexID % 6];
  float n = float(uN), w = 1.0 / n * 1.002, cx = float(k & 1) - 0.5, cy = float(k >> 1) - 0.5;
  float c = (float(gl_InstanceID) + 0.5) / n - 0.5;
  float s, z, ns, nz;
  if (face < 2) { s = cx * w; z = (face == 0 ? 1.0 : -1.0) * uH; ns = 0.0; nz = face == 0 ? 1.0 : -1.0; }
  else { s = (face == 2 ? -0.5 : 0.5) * w; z = cx * 2.0 * uH; ns = face == 2 ? -1.0 : 1.0; nz = 0.0; }
  float l = cy;
  float d = ${STAGGER} * float(gl_InstanceID) / (n - 1.0), q = clamp((uP - d) / (1.0 - ${STAGGER}), 0.0, 1.0);
  q = q < 0.5 ? 4.0 * q * q * q : 1.0 - pow(-2.0 * q + 2.0, 3.0) / 2.0;
  float a = 3.14159265 * q, ca = cos(a), sa = sin(a);
  vec2 sz = vec2(s * ca - z * sa, s * sa + z * ca), nn = vec2(ns * ca - nz * sa, ns * sa + nz * ca);
  vec3 p = uAx < 0.5 ? vec3(c + sz.x, l, sz.y) : vec3(l, -(c + sz.x), sz.y);
  float su = face == 1 ? -s : s;
  vec2 uv = uAx < 0.5 ? vec2(c + su + 0.5, 0.5 - l) : vec2(l + 0.5, c + su + 0.5);
  vA = uv; vK = face < 2 ? float(face) : 2.0;
  vS = 1.0 - 0.45 * (1.0 - clamp(nn.y, 0.0, 1.0)) + 0.14 * nn.x * (uAx < 0.5 ? 1.0 : -1.0) * (1.0 - abs(nn.y));
  p = uR * p; p.z -= uD;
  gl_Position = vec4(p.xy * uF, -1.0002 * p.z - 0.02, -p.z);
}`;
const frag = `#version 300 es
precision mediump float;
uniform sampler2D uA, uB;
in vec2 vA; in float vK, vS; out vec4 o;
void main() {
  vec3 c = vK < 0.5 ? texture(uA, vA).rgb : vK < 1.5 ? texture(uB, vA).rgb : vec3(0.56);
  o = vec4(c * vS, 1.0);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
const u = { p: U('uP'), h: U('uH'), ax: U('uAx'), d: U('uD'), n: U('uN'), r: U('uR'), f: U('uF') };
gl.uniform1i(U('uA'), 0); gl.uniform1i(U('uB'), 1); gl.uniform1i(u.n, N); gl.uniform1f(u.h, THICK / 2);
gl.bindVertexArray(gl.createVertexArray());
gl.enable(gl.DEPTH_TEST);

const tex = img => {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
};
const bind = (unit, t) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); };

let works = [], cur = 0, nxt = 0, state = 'hold', t0 = 0, holdUntil = 0, axis = 0, swapped = false;
let W, H, dpr, mx = 0, my = 0, yaw = 0, pitch = 0;

function resize() {
  dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; gl.viewport(0, 0, canvas.width, canvas.height);
  const f = 1 / Math.tan(FOV / 2), min = Math.min(W, H);
  gl.uniform2f(u.f, f * H / W, f); gl.uniform1f(u.d, 0.5 * f * H / (FILL * min));
}

function show(i) {
  const w = works[i], c = document.querySelector('.caption');
  c.classList.add('out');
  setTimeout(() => {
    for (const k of ['title', 'artist', 'date']) c.querySelector('.' + k[0]).textContent = w[k];
    c.classList.remove('out');
  }, 500);
}

function next(ms = performance.now()) {
  if (state !== 'hold') return;
  nxt = (cur + 1 + Math.floor(Math.random() * (works.length - 1))) % works.length;
  state = 'move'; t0 = ms; swapped = false;
}

const mat = (y, p) => { // pitch(p) * yaw(y), column-major
  const cy = Math.cos(y), sy = Math.sin(y), cp = Math.cos(p), sp = Math.sin(p);
  return new Float32Array([cy, sy * sp, -sy * cp, 0, cp, sp, sy, -cy * sp, cy * cp]);
};

function frame(ms) {
  const t = still ? 0 : ms / 1000;
  let p = 0;
  if (state === 'move') {
    p = Math.min((ms - t0) / (still ? 1500 : TURN), 1);
    if (!swapped && p > 0.3) { swapped = true; show(nxt); }
    if (p >= 1) { cur = nxt; p = 0; state = 'hold'; holdUntil = ms + HOLD; axis = 1 - axis; }
  } else if (ms > holdUntil && works.length) next(ms);

  const k = still ? 0 : 1;
  const ty = (mx * TILT + Math.sin(t * 0.13) * 0.025) * k, tp = (my * TILT + Math.sin(t * 0.09 + 1.3) * 0.018) * k;
  yaw += (ty - yaw) * 0.06; pitch += (tp - pitch) * 0.06;
  gl.uniformMatrix3fv(u.r, false, mat(yaw, pitch));
  gl.uniform1f(u.p, p); gl.uniform1f(u.ax, axis);
  bind(0, works[cur].tex); bind(1, works[state === 'move' ? nxt : cur].tex);
  gl.clearColor(0.976, 0.976, 0.976, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 24, N);
  requestAnimationFrame(frame);
}

addEventListener('pointermove', e => { mx = e.clientX / W * 2 - 1; my = e.clientY / H * 2 - 1; });
document.addEventListener('pointerleave', () => { mx = my = 0; });
canvas.addEventListener('click', () => next());
addEventListener('resize', resize);

(async () => {
  works = await (await fetch('../islands/works.json')).json();
  await Promise.all(works.map(w => new Promise(res => {
    w.img = new Image(); w.img.onload = () => { w.tex = tex(w.img); res(); }; w.img.src = '../islands/' + w.src;
  })));
  cur = Math.floor(Math.random() * works.length);
  resize(); show(cur); holdUntil = performance.now() + HOLD;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
