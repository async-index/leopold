<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leopold Explore</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--white); color: var(--black);
    font: 9px/1.4 var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  a { color: inherit; text-decoration: none; }

  .view { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .view.dragging { cursor: grabbing; }
  .field { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .field.ease { transition: transform .6s cubic-bezier(.6, 0, .2, 1); }
  .item { position: absolute; left: 0; top: 0; transition: transform .5s cubic-bezier(.6, 0, .2, 1), opacity .3s; }
  .item[hidden] { display: none; }
  .item img { display: block; width: 100%; height: 100%; object-fit: cover; background: #ececea; -webkit-user-drag: none; user-select: none; }
  .three { width: 100%; height: 100%; position: relative; }
  .three canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .three canvas:active { cursor: grabbing; }
  .proj { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center;
    border: 1px solid var(--black); background: var(--white); white-space: nowrap; }
  .proj span { padding: 0 10px; }
  .proj button { width: 24px; height: 24px; border: 0; border-left: 1px solid var(--black); background: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  .proj button:hover { background: var(--black); color: var(--white); }
  body[data-step="2"] .proj { display: none; }
  .tilt { position: relative; width: 100%; height: 100%; transition: transform .35s ease-out; }
  .item .txt { position: absolute; top: 100%; left: 0; width: 100%; padding-top: 6px; transition: opacity .3s; }
  .item .k { opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item h2 { font: 15px/1.15 var(--font); letter-spacing: -0.03em; margin: 3px 0 4px; }
  .item .x { text-transform: none; font-size: 10px; line-height: 1.35; letter-spacing: 0; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .card { width: 100%; height: 100%; border: 1px solid var(--black); padding: 12px; display: flex; align-items: flex-end;
    font: 22px/1.1 var(--font); letter-spacing: -0.03em; background: var(--white); }
  /* Overview (scale .23): category + title only, sized to stay ~8–9px on screen */
  body[data-step="2"] .item .txt { width: max(100%, 380px); padding-top: calc(4px / .23); }
  body[data-step="2"] .item .r, body[data-step="2"] .item .x { display: none; }
  body[data-step="2"] .item .k { font-size: calc(8px / .23); }
  body[data-step="2"] .item h2 { font-size: calc(9px / .23); line-height: 1.15; margin: calc(1px / .23) 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item { cursor: pointer; }

  /* Overlaid navigation, top left */
  .nav { position: fixed; top: 10px; left: 10px; z-index: 2; width: 320px; max-width: calc(100% - 20px);
    background: var(--white); border: 1px solid var(--black); }
  .bar { display: flex; height: 28px; }
  .bar > * { border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  .bar input { flex: 1; min-width: 0; padding: 0 8px; outline: none; }
  .bar input::placeholder { color: var(--black); opacity: .35; }
  .bar button { width: 28px; flex: none; border-left: 1px solid var(--black); cursor: pointer; display: grid; place-items: center; }
  .bar button:hover:not(:disabled), .panel a:hover, .panel button:hover { background: var(--black); color: var(--white); }
  .bar button:disabled { opacity: .25; cursor: default; }
  .bar svg { width: 11px; height: 11px; display: block; }
  .panel { border-top: 1px solid var(--black); }
  .panel[hidden] { display: none; }
  .panel a, .panel button { display: flex; justify-content: space-between; width: 100%; padding: 6px 8px; border: 0;
    border-bottom: 1px solid var(--black); background: none; color: inherit; font: inherit; letter-spacing: inherit;
    text-transform: inherit; text-align: left; cursor: pointer; }
  .panel > :last-child { border-bottom: 0; }
  .panel .on { background: var(--black); color: var(--white); }
  .panel span { opacity: .45; }
  .panel .head { padding: 6px 8px; border-bottom: 1px solid var(--black); opacity: .45; }
  .count { position: fixed; left: 10px; bottom: 10px; padding: 2px 4px; background: var(--white); color: rgba(23, 23, 23, .5); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body data-step="0">
<div class="view"><div class="field"></div></div>
<div class="nav">
  <div class="bar">
    <input type="search" placeholder="Suchen" aria-label="Suchen">
    <button class="zout" aria-label="Zoom out"><svg viewBox="0 0 11 11"><path d="M1 5.5h9" stroke="currentColor"/></svg></button>
    <button class="zin" aria-label="Zoom in"><svg viewBox="0 0 11 11"><path d="M1 5.5h9M5.5 1v9" stroke="currentColor"/></svg></button>
    <button class="tfilter" aria-label="Filter"><svg viewBox="0 0 11 11"><path d="M3 1v9M8 1v9M1.5 3.5h3M6.5 7.5h3" stroke="currentColor"/></svg></button>
    <button class="tmenu" aria-label="Menu"><svg viewBox="0 0 11 11"><path d="M1 3.5h9M1 7.5h9" stroke="currentColor"/></svg></button>
  </div>
  <div class="panel suggest" hidden></div>
  <div class="panel filter" hidden></div>
  <div class="panel menu" hidden>
    <a href="https://www.leopoldmuseum.org/de/besuch/tickets-preise/online-ticket" target="_blank">Tickets <span>↗</span></a>
    <a href="https://www.leopoldmuseum.org/de/besuch/oeffnungszeiten" target="_blank">Öffnungszeiten <span>↗</span></a>
    <a href="https://www.leopoldmuseum.org/de/besuch/anreise" target="_blank">Anreise <span>↗</span></a>
    <a href="https://www.leopoldmuseum.org/de/newsletter" target="_blank">Newsletter <span>↗</span></a>
    <a href="https://www.leopoldmuseum.org/de/kontakt" target="_blank">Kontakt <span>↗</span></a>
    <a href="../">Leopold <span>Explorations</span></a>
  </div>
</div>
<div class="count"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const CELL = 480, STEPS = [1.4, 1, 0.23]; // cell pitch at scale 1 (css px), scale per zoom step
const view = document.querySelector('.view'), field = document.querySelector('.field');
const zin = document.querySelector('.zin'), zout = document.querySelector('.zout');
// Site content, current exhibitions and programme first so they take the centre.
const CATS = ['Ausstellungen', 'Programm', 'Besuch', 'Sammlung', 'Museum', 'Forschung', 'Engagement', 'Vermietung', 'Presse', 'Info'];
// The two 3D models from the figure and museum explorations, mixed in with the posts.
const OBJECTS = [
  // Not posts: big interactive visuals (size in cells), no text, placed in the first ring around the centre.
  // at: preferred spot in the default view, in cells from the field's centre (apart, either side of it).
  { three: 'figure', cat: 'Sammlung', title: 'Figur', w: 1.15, h: 1.65, at: [-1.6, 0] },
  { three: 'museum', cat: 'Museum', title: 'Das Leopold Museum', w: 1.75, h: 1.15, at: [1.8, .2] },
];
const works = [...OBJECTS, ...await (await fetch('items.json')).json()].sort((a, b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat));

// Field: a square of cells, odd columns dropped half a cell, small fixed jitter per cell.
const COLS = Math.ceil(Math.sqrt(works.length)), ROWS = Math.ceil(works.length / COLS) + 2; // +1 row of room for the visuals
let seed = 1918; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cells = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
  cells.push({ x: c * CELL + (rnd() - .5) * CELL * .1, y: r * CELL + (c % 2) * CELL / 2 + (rnd() - .5) * CELL * .1 });
const FW = COLS * CELL, FH = ROWS * CELL + CELL / 2;
// Cells nearest the centre first, so a filtered set gathers in the middle.
const order = cells.map((c, i) => i).sort((a, b) =>
  Math.hypot(cells[a].x + CELL / 2 - FW / 2, cells[a].y + CELL / 2 - FH / 2) - Math.hypot(cells[b].x + CELL / 2 - FW / 2, cells[b].y + CELL / 2 - FH / 2));

const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const items = works.map(w => {
  // Equal area per item, uncropped; room left below for the text.
  if (w.three) {
    const el = document.createElement('div'); el.className = 'item big';
    const wd = w.w * CELL, ht = w.h * CELL;
    el.style.width = wd + 'px'; el.style.height = ht + 'px';
    const img = document.createElement('div'); img.className = 'three'; img.append(document.createElement('canvas'));
    if (w.three === 'figure') img.insertAdjacentHTML('beforeend', '<div class="proj"><span></span><button data-d="-1" aria-label="Vorheriges Werk">‹</button><button data-d="1" aria-label="Nächstes Werk">›</button></div>');
    el.append(img); field.append(el);
    return { w, el, img, wd, ht, x: 0, y: 0, res: 1 };
  }
  const s = CELL * .6, k = Math.min(1, CELL * .66 / (s * Math.max(Math.sqrt(w.r), 1 / Math.sqrt(w.r))));
  const wd = s * Math.sqrt(w.r) * k, ht = wd / w.r;
  const el = document.createElement('div'); el.className = 'item';
  el.style.width = wd + 'px'; el.style.height = ht + 'px';
  const img = document.createElement(w.img ? 'img' : 'div');
  if (w.img) { img.alt = w.title; img.decoding = 'async'; img.draggable = false; }
  else { img.className = 'card'; img.textContent = w.title; }
  const when = w.when + (w.more ? ` (+${w.more} Termine)` : '');
  const txt = document.createElement('div'); txt.className = 'txt';
  const rest = [w.kicker, when].filter(Boolean).join(' · ');
  txt.innerHTML = `<div class="k"><span class="c">${esc(w.cat)}</span><span class="r">${rest ? ' · ' + esc(rest) : ''}</span></div><h2>${esc(w.title)}</h2>` +
    `<div class="x">${esc(w.sub || w.text)}</div>`;
  const tilt = document.createElement('div'); tilt.className = 'tilt';
  tilt.append(img, txt); el.append(tilt); field.append(el);
  return { w, el, img, wd, ht, x: 0, y: 0, res: 0 };
});

let step = 0, scale = STEPS[0], px = 0, py = 0;
function apply(ease) {
  field.classList.toggle('ease', !!ease);
  field.style.transform = `translate(${px}px, ${py}px) scale(${scale})`;
  document.body.dataset.step = step;
  zin.disabled = step === 0; zout.disabled = step === STEPS.length - 1;
  clearTimeout(apply.t); apply.t = setTimeout(load, ease ? 650 : 120);
  sharpen3D();
}
// Load only what is on screen: museum preview when small, the larger file at the closest step.
function load() {
  const m = 400 / scale, x0 = -px / scale - m, y0 = -py / scale - m, x1 = x0 + innerWidth / scale + 2 * m, y1 = y0 + innerHeight / scale + 2 * m;
  for (const it of items) {
    if (it.el.hidden || it.x + it.wd < x0 || it.x > x1 || it.y + it.ht < y0 || it.y > y1) continue;
    if (!it.res && it.w.img) { it.img.src = it.w.img; it.res = 1; }
  }
}
function zoomTo(s, ax = innerWidth / 2, ay = innerHeight / 2) {
  s = Math.max(0, Math.min(STEPS.length - 1, s)); if (s === step) return;
  const k = STEPS[s] / scale; px = ax - (ax - px) * k; py = ay - (ay - py) * k;
  step = s; scale = STEPS[s]; clamp(); apply(true);
}
function centreOn(x, y) { px = innerWidth / 2 - x * scale; py = innerHeight / 2 - y * scale; clamp(); }
function clamp() {
  px = Math.min(innerWidth / 2, Math.max(innerWidth / 2 - FW * scale, px));
  py = Math.min(innerHeight / 2, Math.max(innerHeight / 2 - FH * scale, py));
}

// Search + filter: matching works take the cells nearest the centre.
let query = '', artist = '';
const overlap = (c, x, y, w, h) => { const cw = c.w ?? CELL, ch = c.h ?? CELL;
  return Math.max(0, Math.min(c.x + cw, x + w) - Math.max(c.x, x)) * Math.max(0, Math.min(c.y + ch, y + h) - Math.max(c.y, y)); };
function layout() {
  const q = query.toLowerCase();
  // Visuals first (only with no search, and in "Alle" or their own category); every cell
  // they cover by more than a quarter is taken, so posts flow around them.
  const taken = new Set();
  for (const it of items) if (it.w.three) {
    const on = !q && (!artist || artist === it.w.cat);
    it.el.hidden = !on; if (!on) continue;
    const fits = i => { const c = cells[i]; const x = c.x + CELL / 2 - it.wd / 2, y = c.y + CELL / 2 - it.ht / 2;
      return x >= 0 && y >= 0 && x + it.wd <= FW && y + it.ht <= FH && ![...taken].some(t => overlap(cells[t], x, y, it.wd, it.ht) > 0) ? { x, y } : null; };
    const tx = FW / 2 + it.w.at[0] * CELL, ty = FH / 2 + it.w.at[1] * CELL;
    const near = artist ? order : [...order].sort((a, b) => Math.hypot(cells[a].x + CELL / 2 - tx, cells[a].y + CELL / 2 - ty) - Math.hypot(cells[b].x + CELL / 2 - tx, cells[b].y + CELL / 2 - ty));
    const k = near.find(fits);
    if (k === undefined) { it.el.hidden = true; continue; }
    const { x, y } = fits(k); it.x = x; it.y = y;
    // A post sits in the middle two thirds of its cell's width, image plus text down to ~95% of its height.
    cells.forEach((c, i) => { if (overlap({ x: c.x + CELL * .17, y: c.y + CELL * .02, w: CELL * .66, h: CELL * .93 }, x, y, it.wd, it.ht) > 0) taken.add(i); });
    it.el.style.transform = `translate(${x}px, ${y}px)`;
  }
  const free = order.filter(i => !taken.has(i));
  let n = 0;
  for (const it of items) {
    if (it.w.three) continue;
    const on = (!artist || it.w.cat === artist) && (!q || [it.w.cat, it.w.kicker, it.w.title, it.w.sub, it.w.text, it.w.when].join(' ').toLowerCase().includes(q));
    it.el.hidden = !on; if (!on) continue;
    const c = cells[free[n++]];
    it.x = c.x + (CELL - it.wd) / 2; it.y = c.y + (CELL * .72 - it.ht) / 2;
    it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
  }
  document.querySelector('.count').textContent = n + ' / ' + (works.length - OBJECTS.length);
  // Centre the view on what is showing (captions included), not on the field.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of items) if (!it.el.hidden) {
    x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y);
    x1 = Math.max(x1, it.x + it.wd); y1 = Math.max(y1, it.y + it.ht + (txtOf(it)?.offsetHeight ?? 0));
  }
  if (n) centreOn((x0 + x1) / 2, (y0 + y1) / 2); else centreOn(FW / 2, FH / 2);
  apply(true);
}

const txtOf = it => it.el.querySelector('.txt');
// Hover: the card (image + text) tips subtly toward the cursor in 3D.
const SKEW = 6; // max degrees
let tipped = null;
view.addEventListener('pointermove', e => {
  const el = !drag && e.pointerType === 'mouse' ? e.target.closest?.('.item:not(.big)') : null;
  if (tipped && tipped !== el) { tipped.firstChild.style.transform = ''; tipped = null; }
  if (!el) return;
  const r = el.firstChild.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
  el.firstChild.style.transform = `perspective(900px) rotateX(${-v * 2 * SKEW}deg) rotateY(${u * 2 * SKEW}deg)`;
  tipped = el;
});
view.addEventListener('pointerleave', () => { if (tipped) { tipped.firstChild.style.transform = ''; tipped = null; } });

// Drag to pan; a click without movement opens the item at any zoom step.
let drag = null;
view.addEventListener('pointerdown', e => { if (e.target.matches('.three canvas')) return; drag = { x: e.clientX, y: e.clientY, px, py, moved: 0 }; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
  if (drag.moved < 4) return;
  view.classList.add('dragging');
  px = drag.px + e.clientX - drag.x; py = drag.py + e.clientY - drag.y; clamp(); apply(false);
});
view.addEventListener('pointerup', e => {
  const d = drag; drag = null; view.classList.remove('dragging');
  if (!d || d.moved >= 4) return;
  view.releasePointerCapture(e.pointerId);
  const at = document.elementsFromPoint(e.clientX, e.clientY);
  const btn = at.find(el => el.matches?.('.proj button'));
  if (btn) { cycleProjection(+btn.dataset.d); return; }
  const hit = at.find(el => el.classList?.contains('item'));
  const it = hit && items.find(i => i.el === hit); if (!it) return;
  if (!it.w.three) open(it.w.url, '_blank');
});
// Wheel / trackpad: one zoom step per gesture, anchored at the cursor.
let acc = 0, lock = 0;
view.addEventListener('wheel', e => {
  e.preventDefault(); if (performance.now() < lock) return;
  acc += e.deltaY; if (Math.abs(acc) < 40) return;
  zoomTo(step + Math.sign(acc), e.clientX, e.clientY); acc = 0; lock = performance.now() + 700;
}, { passive: false });
zin.onclick = () => zoomTo(step - 1);
zout.onclick = () => zoomTo(step + 1);

// Navigation panels
const pf = document.querySelector('.panel.filter'), pm = document.querySelector('.panel.menu');
const counts = {}; works.forEach(w => { if (!w.three) counts[w.cat] = (counts[w.cat] || 0) + 1; });
const top = CATS.filter(c => counts[c]).map(c => [c, counts[c]]);
pf.innerHTML = [['', works.length - OBJECTS.length], ...top].map(([a, n]) => `<button data-a="${a}">${a || 'Alle'} <span>(${n})</span></button>`).join('');
pf.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  artist = b.dataset.a; pf.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); layout();
};
pf.firstChild.classList.add('on');
const ps = document.querySelector('.panel.suggest'), input = document.querySelector('.bar input');
const setFilter = a => { artist = a; pf.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.a === a)); };
document.querySelector('.tfilter').onclick = () => { pf.hidden = !pf.hidden; pm.hidden = ps.hidden = true; };
document.querySelector('.tmenu').onclick = () => { pm.hidden = !pm.hidden; pf.hidden = ps.hidden = true; };
// Search always covers everything: typing resets the filter to all.
input.addEventListener('input', e => {
  query = e.target.value.trim(); ps.hidden = !!query;
  if (query && artist) setFilter('');
  layout();
});
// Suggestions on focus: what most visitors look for. q = search term, cat = optional filter with it.
const SUGGEST = [
  ['Tickets', 'Tickets'], ['Öffnungszeiten', 'Öffnungszeiten'], ['Aktuelle Ausstellungen', 'aktuell', 'Ausstellungen'],
  ['Demnächst', 'vorschau', 'Ausstellungen'], ['Führungen', 'Führung'], ['Für Kinder', 'Kinder'], ['Anreise', 'Anreise'],
  ['Café', 'Café'], ['Shop', 'Shop'], ['Barrierefreiheit', 'Barrierefrei'], ['Kontakt', 'Kontakt'],
];
ps.innerHTML = '<div class="head">Häufig gesucht</div>' + SUGGEST.map(([l], i) => `<button data-i="${i}">${l}</button>`).join('');
ps.addEventListener('pointerdown', e => e.preventDefault()); // keep focus so the click lands before blur
ps.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const [, q, cat = ''] = SUGGEST[b.dataset.i];
  input.value = query = q; setFilter(cat); ps.hidden = true; input.blur(); layout();
};
input.addEventListener('focus', () => { if (!input.value) { ps.hidden = false; pf.hidden = pm.hidden = true; } });
input.addEventListener('blur', () => { ps.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') { pf.hidden = pm.hidden = ps.hidden = true; } });
addEventListener('resize', () => { clamp(); apply(false); });

// ---- 3D cards: figure (artwork projections) and museum (plain) ----
// Each renders into its own canvas, sharp at every zoom step, only while on screen.
// Drag on a model to rotate it, as in ../figure/ and ../museum/ (wheel stays the field's zoom).

// Figure material: the artwork cast along x, y and z and blended by surface direction (as in ../figure/).
const tri = { triMap: { value: null }, triScale: { value: 1 }, triAspect: { value: 1 } };
const figureMaterial = new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0 });
figureMaterial.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, tri);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNormal;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vTriPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vTriNormal = normalize(mat3(modelMatrix) * objectNormal);`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      uniform sampler2D triMap; uniform float triScale; uniform float triAspect;
      varying vec3 vTriPos; varying vec3 vTriNormal;
      vec4 triSample(vec2 p) { return texture2D(triMap, p * triScale * vec2(1.0 / triAspect, 1.0) + 0.5); }`)
    .replace('#include <map_fragment>', `
      vec3 tw = pow(abs(normalize(vTriNormal)), vec3(4.0));
      tw /= tw.x + tw.y + tw.z;
      diffuseColor *= triSample(vTriPos.zy) * tw.x + triSample(vTriPos.xz) * tw.y + triSample(vTriPos.xy) * tw.z;`);
};

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const views = items.filter(it => it.w.three).map(it => {
  const fig = it.w.three === 'figure';
  const renderer = new THREE.WebGLRenderer({ canvas: it.img.querySelector('canvas'), antialias: true, alpha: true });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = fig ? 0.6 : 0.15;
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-2, 3, 4);
  const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(3, 1, -3);
  scene.add(key, rim, new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.6));
  // Museum: the lighting of ../museum/ (strong key, little fill) so the white faces separate.
  if (!fig) { key.intensity = 2.6; key.position.set(-4, 3, 2); rim.intensity = 0.5; scene.children.at(-1).intensity = 0.25;
    // ...and its soft shadows from the key light (balcony, entrance, roof edges).
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    key.castShadow = true; key.shadow.mapSize.set(2048, 2048); }
  const camera = new THREE.PerspectiveCamera(30, it.wd / it.ht, 0.01, 100);
  const controls = new OrbitControls(camera, renderer.domElement);
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, enableZoom: false, enablePan: false });
  const v = { it, renderer, scene, camera, controls, size: null };
  loader.load(fig ? '../figure/figure.glb' : '../museum/museum.glb', gltf => {
    const model = gltf.scene;
    const mat = fig ? figureMaterial : new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 0.9 });
    model.traverse(o => { if (o.isMesh) { o.material = mat; o.castShadow = o.receiveShadow = !fig; if (fig || !o.geometry.attributes.normal) o.geometry.computeVertexNormals(); } });
    const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
    // The model stays put (the projection is in world space, as in ../figure/); the camera orbits it.
    model.position.sub(box.getCenter(new THREE.Vector3())); scene.add(model); v.size = size;
    if (fig) tri.triScale.value = 1 / size.y;
    // Tight framing that still fits while orbiting: height ~92%, the footprint's diagonal ~95% of the width.
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), diag = Math.hypot(size.x, size.z);
    const dist = Math.max(size.y / 2 / .92, diag / 2 / .95 / camera.aspect) / t + diag / 2;
    const az = fig ? 0 : THREE.MathUtils.degToRad(-38), el = fig ? 0 : THREE.MathUtils.degToRad(6);
    camera.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist);
    controls.update();
    if (!fig) { // shadow frustum fitted around the model, as in ../museum/
      const r = size.length() / 2, key = scene.children.find(o => o.castShadow);
      key.position.normalize().multiplyScalar(r * 2);
      Object.assign(key.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: r * .5, far: r * 3.5 });
      key.shadow.camera.updateProjectionMatrix(); key.shadow.bias = -0.0002; key.shadow.normalBias = r * 0.002;
    }
    camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
  });
  return v;
});
function sharpen3D() {
  for (const v of views ?? []) { v.renderer.setPixelRatio(Math.min(devicePixelRatio, 2) * scale); v.renderer.setSize(v.it.wd, v.it.ht, false); }
}
sharpen3D();

const projections = await (await fetch('../figure/textures/works.json')).json();
const texCache = new Map();
// -1 = no projection: a black figure (the default).
const black = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); black.needsUpdate = true;
let proj = -1;
async function cycleProjection(d) {
  proj = (proj + 1 + d + projections.length + 1) % (projections.length + 1) - 1;
  const label = items.find(it => it.w.three === 'figure').el.querySelector('.proj span');
  if (proj < 0) { tri.triMap.value = black; tri.triAspect.value = 1; label.textContent = 'Keine Projektion'; return; }
  const w = projections[proj], src = '../figure/' + w.src;
  if (!texCache.has(src)) texCache.set(src, new THREE.TextureLoader().loadAsync(src).then(t => {
    t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.anisotropy = 8; return t;
  }));
  const t = await texCache.get(src);
  if (projections[proj] !== w) return; // a later click won
  tri.triMap.value = t; tri.triAspect.value = t.image.width / t.image.height;
  label.textContent = `${w.title} · ${w.artist}`;
}
cycleProjection(0);

(function frame() {
  for (const v of views) {
    const { it } = v;
    if (!v.size || it.el.hidden) continue;
    const sx = px + it.x * scale, sy = py + it.y * scale;
    if (sx > innerWidth || sy > innerHeight || sx + it.wd * scale < 0 || sy + it.ht * scale < 0) continue;
    v.controls.update();
    v.renderer.render(v.scene, v.camera);
  }
  requestAnimationFrame(frame);
})();

layout();
// Open on the current exhibition PREMIERE!, image and text centred in the window.
const home = items.find(it => it.w.cat === 'Ausstellungen' && it.w.title === 'PREMIERE!');
if (home) { centreOn(home.x + home.wd / 2, home.y + (home.ht + txtOf(home).offsetHeight) / 2); apply(false); }
</script>
</body>
</html>
