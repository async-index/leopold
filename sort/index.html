<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Sort</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.over canvas { cursor: pointer; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<canvas></canvas>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script>
const N = 384;                         // working resolution
const HOLD = 3, MELT = 2.6, CROSS = 0.9, SPREAD = 0.55; // seconds; SPREAD: column ripple share of the melt
const LO = 0.08, HI = 1;                         // break runs only at the darkest 8% of pixels: long streaks

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: false });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const vert = `#version 300 es
precision highp float; precision highp int;
precision highp sampler2DArray; precision highp usampler2DArray;
uniform sampler2DArray uCol;
uniform usampler2DArray uMap;          // per layer (img*2+dir): r = target slot, g = source of slot
uniform int uA, uB, uDir;
uniform float uP, uUn, uC, uS, uSpread;
uniform vec2 uRes, uOrg;
out vec3 c;
float h(vec2 v) { return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }
float sm(float x) { x = clamp(x, 0.0, 1.0); return x * x * x * (x * (x * 6.0 - 15.0) + 10.0); }
void main() {
  int a = gl_VertexID % ${N}, b = gl_VertexID / ${N};
  float tg = float(texelFetch(uMap, ivec3(a, b, uA * 2 + uDir), 0).r);
  ivec2 st = uDir == 1 ? ivec2(b, a) : ivec2(a, b);
  c = texelFetch(uCol, ivec3(st, uA), 0).rgb;
  float f = float(a) / ${N}.0, d = uSpread * (0.7 * f + 0.3 * h(vec2(float(a), 7.0)));
  float e = sm((uP * (1.0 + uSpread) - d) / 1.0);
  e = uUn > 0.5 ? 1.0 - e : e;
  if (uC > 0.0) {                      // cross: crossfade to the other work's sorted pixel in the same slot
    int t = int(tg);
    int sb = int(texelFetch(uMap, ivec3(a, t, uB * 2 + uDir), 0).g);
    vec3 cb = texelFetch(uCol, ivec3(uDir == 1 ? ivec2(sb, a) : ivec2(a, sb), uB), 0).rgb;
    c = mix(c, cb, sm(uC * 1.4 - 0.4 * f));
    e = 1.0;
  }
  float y = floor(mix(float(b), tg, e) + 0.5);
  vec2 q = uDir == 1 ? vec2(y, float(a)) : vec2(float(a), y);
  vec2 p0 = floor(q * uS), p1 = floor((q + 1.0) * uS);
  vec2 ctr = uOrg + (p0 + p1) * 0.5;
  gl_PointSize = max(p1.x - p0.x, p1.y - p0.y);
  gl_Position = vec4(ctr.x / uRes.x * 2.0 - 1.0, 1.0 - ctr.y / uRes.y * 2.0, 0.0, 1.0);
}`;
const frag = `#version 300 es
precision mediump float; in vec3 c; out vec4 o;
void main() { o = vec4(c, 1.0); }`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
const u = {}; for (const n of ['uCol', 'uMap', 'uA', 'uB', 'uDir', 'uP', 'uUn', 'uC', 'uS', 'uSpread', 'uRes', 'uOrg']) u[n] = U(n);
gl.uniform1i(u.uCol, 0); gl.uniform1i(u.uMap, 1); gl.uniform1f(u.uSpread, SPREAD);
gl.bindVertexArray(gl.createVertexArray());

// For one direction: per column, sort runs of mid-tone pixels by brightness. Returns [target slot, source of slot] per pixel.
function sortMap(L, dir, lo, hi) {
  const m = new Uint16Array(N * N * 2), key = new Int32Array(N);
  for (let a = 0; a < N; a++) {
    const at = b => (dir ? a * N + b : b * N + a) , put = (b, t, s) => { m[(b * N + a) * 2] = t; m[(t * N + a) * 2 + 1] = s; };
    for (let b = 0; b < N;) {
      if (L[at(b)] < lo || L[at(b)] > hi) { put(b, b, b); b++; continue; }
      let e = b, n = 0;
      while (e < N && L[at(e)] >= lo && L[at(e)] <= hi) key[n++] = L[at(e)] * 512 + e++;
      const k = key.subarray(0, n).sort();
      for (let i = 0; i < n; i++) put(k[i] & 511, b + i, k[i] & 511);
      b = e;
    }
  }
  return m;
}

let works = [], W, H, S, org = [0, 0], box = [0, 0, 0, 0];
function layout() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  const avail = Math.min(W - 48, H - 112) * dpr;
  S = avail / N; if (S >= 2) S = Math.floor(S);
  const sz = Math.floor(N * S);
  org = [Math.round((canvas.width - sz) / 2), Math.round((canvas.height - sz) / 2 - 8 * dpr)];
  box = [org[0] / dpr, org[1] / dpr, sz / dpr, sz / dpr];
  gl.uniform1f(u.uS, S); gl.uniform2f(u.uOrg, org[0], org[1]);
}

let cur, dir = 0, dir0 = 0, t0 = 0, shown = -1, mx = -1, my = -1;
function draw(img, p, un, other = 0, c = 0) {
  gl.uniform1i(u.uA, img); gl.uniform1i(u.uB, other); gl.uniform1i(u.uDir, dir);
  gl.uniform1f(u.uP, p); gl.uniform1f(u.uUn, un); gl.uniform1f(u.uC, c);
  gl.drawArrays(gl.POINTS, 0, N * N);
}
function caption(i) {
  if (shown === i) return; shown = i;
  for (const k of ['t', 'a', 'd']) document.querySelector('.caption .' + k).textContent = works[i][{ t: 'title', a: 'artist', d: 'date' }[k]];
}
function frame(ms) {
  const T = ms / 1000 - t0, n = works.length;
  const m = still ? 0 : MELT, c = still ? 0 : CROSS, cycle = HOLD + m + c + m;
  let k = Math.floor(T / cycle), r = T - k * cycle;
  const a = (cur + k) % n, b = (a + 1) % n; dir = (k + dir0) & 1;
  gl.clearColor(0.976, 0.976, 0.976, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (r < HOLD) { draw(a, 0, 0); caption(a); }
  else if (r < HOLD + m) { draw(a, 1, 0); draw(a, (r - HOLD) / m, 0); caption(a); }
  else if (r < HOLD + m + c) { const x = (r - HOLD - m) / c; draw(a, 1, 0, b, x); caption(x > 0.5 ? b : a); }
  else { draw(b, 1, 0); draw(b, (r - HOLD - m - c) / m, 1); caption(b); }
  requestAnimationFrame(frame);
}

addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  document.body.classList.toggle('over', mx >= box[0] && mx < box[0] + box[2] && my >= box[1] && my < box[1] + box[3]);
});
canvas.addEventListener('click', () => document.body.classList.contains('over') && open(works[shown].url, '_blank'));
addEventListener('resize', layout);

(async () => {
  works = await (await fetch('../islands/works.json')).json();
  const imgs = await Promise.all(works.map(w => new Promise(res => {
    const im = new Image(); im.onload = () => res(im); im.src = '../islands/' + w.src;
  })));
  const n = imgs.length, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const cx = cv.getContext('2d', { willReadFrequently: true }); cx.imageSmoothingQuality = 'high';
  const col = gl.createTexture(), map = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, col);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, N, N, n);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, map);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RG16UI, N, N, n * 2);
  for (const t of [col, map]) {
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  }
  imgs.forEach((im, i) => {
    cx.drawImage(im, 0, 0, N, N);
    const px = cx.getImageData(0, 0, N, N).data, L = new Uint8Array(N * N);
    for (let j = 0; j < N * N; j++) L[j] = (px[j * 4] * 0.299 + px[j * 4 + 1] * 0.587 + px[j * 4 + 2] * 0.114);
    const s = Uint8Array.from(L).sort(), lo = s[Math.floor(N * N * LO)], hi = s[Math.min(N * N - 1, Math.floor(N * N * HI))];
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, col);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, N, N, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, map);
    for (const d of [0, 1]) gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i * 2 + d, N, N, 1, gl.RG_INTEGER, gl.UNSIGNED_SHORT, sortMap(L, d, lo, hi));
  });
  cur = Math.floor(Math.random() * n);
  layout();
  t0 = performance.now() / 1000;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
