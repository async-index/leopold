<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leopold Colour</title>
<style>
  :root { --white: #f9f9f9; --black: #171717; --margin: 24px; --font: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--white); color: var(--black);
    font: 9px/180% var(--font); letter-spacing: -0.02em; text-transform: uppercase; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.over canvas { cursor: pointer; }
  nav { position: fixed; top: 0; left: 0; padding: 13px var(--margin); z-index: 1; }
  nav a { padding: 2px 6px; margin-left: -6px; background: var(--white); }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .6; }
  .caption { position: fixed; left: 0; right: 0; bottom: 14px; padding: 0 var(--margin); display: flex; gap: 8px;
    justify-content: center; text-align: center; pointer-events: none; }
  .caption span { background: var(--white); padding: 0 6px; }
  body:not(.over) .caption { visibility: hidden; }
</style>
</head>
<body>
<nav><a href="../">Leopold</a></nav>
<canvas></canvas>
<div class="caption"><span class="t"></span><span class="a"></span><span class="d"></span></div>
<script>
const LIFT = 4; // hovered tile size in field tiles

const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let field, atlas, W, H, dpr, scale, ox = 0, oy = 0, tx = 0.5, ty = 0.5, px = 0.5, py = 0.5;
let mx = -1, my = -1, moved = -1e9, over = -1;
const big = new Map();

function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  scale = Math.max(W / field.cols, H / field.rows); // css px per tile, field covers the viewport
}

// Larger thumb for the lifted tile, loaded on demand.
function thumb(i) {
  if (!big.has(i)) { const im = new Image(); im.src = '../grid/' + field.works[i].thumb; big.set(i, im); }
  const im = big.get(i); return im.complete && im.naturalWidth ? im : null;
}

function frame(ms) {
  // Pan across the overflow: follow the cursor, or drift slowly when it rests.
  if (!still && ms - moved > 3000) { tx = 0.5 + 0.45 * Math.sin(ms / 23000); ty = 0.5 + 0.45 * Math.sin(ms / 31000 + 1); }
  px += (tx - px) * 0.04; py += (ty - py) * 0.04;
  const fw = field.cols * scale, fh = field.rows * scale;
  ox = (W - fw) * px; oy = (H - fh) * py;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(atlas, ox, oy, fw, fh);

  const c = Math.floor((mx - ox) / scale), r = Math.floor((my - oy) / scale);
  const i = mx >= 0 && c >= 0 && c < field.cols && r >= 0 && r < field.rows ? r * field.cols + c : -1;
  if (i !== over) {
    over = i;
    document.body.classList.toggle('over', i >= 0);
    if (i >= 0) for (const k of ['t', 'a', 'd']) document.querySelector('.caption .' + k).textContent =
      field.works[i][{ t: 'title', a: 'artist', d: 'date' }[k]];
  }
  if (over >= 0) {
    const s = scale * LIFT, x = Math.min(Math.max(ox + (c + 0.5) * scale - s / 2, 0), W - s),
      y = Math.min(Math.max(oy + (r + 0.5) * scale - s / 2, 0), H - s), t = field.tile;
    const im = thumb(over);
    if (im) ctx.drawImage(im, x, y, s, s);
    else ctx.drawImage(atlas, c * t, r * t, t, t, x, y, s, s);
  }
  requestAnimationFrame(frame);
}

addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; });
addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY; moved = performance.now();
  if (e.pointerType === 'mouse') { tx = mx / W; ty = my / H; }
});
document.addEventListener('pointerleave', () => { mx = my = -1; });
canvas.addEventListener('click', () => over >= 0 && open(field.works[over].url, '_blank'));
addEventListener('resize', resize);

(async () => {
  field = await (await fetch('works.json')).json();
  atlas = new Image(); atlas.src = 'atlas.jpg'; await atlas.decode();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
